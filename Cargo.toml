[workspace]
resolver = "2"
members = ["src-tauri", "crates/diskus-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
diskus-core = { path = "crates/diskus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4"
blake3 = "1"
dirs = "6"
sysinfo = "0.38"
log = "0.4"
time = { version = "0.3", features = [
    "formatting",
    "parsing",
    "macros",
    "local-offset",
    "serde-human-readable",
] }

# Opts every crate into the same fast, lean release profile.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true