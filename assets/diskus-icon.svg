<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Diskus storage analysis icon</title>
  <defs>
    <linearGradient id="tile-blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#83a0ff"/>
      <stop offset="1" stop-color="#526ef0"/>
    </linearGradient>
    <linearGradient id="tile-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6fe0f4"/>
      <stop offset="1" stop-color="#22b8d5"/>
    </linearGradient>
    <linearGradient id="tile-green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6ce8b0"/>
      <stop offset="1" stop-color="#27bd80"/>
    </linearGradient>
    <linearGradient id="tile-amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd567"/>
      <stop offset="1" stop-color="#f3a921"/>
    </linearGradient>
    <linearGradient id="tile-rose" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff7794"/>
      <stop offset="1" stop-color="#ec4569"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="#090d17"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="57.25" fill="none" stroke="#29334a" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="34" y="40" width="70" height="174" rx="12" fill="url(#tile-rose)"/>
    <rect x="112" y="40" width="64" height="108" rx="12" fill="url(#tile-cyan)"/>
    <rect x="184" y="40" width="38" height="52" rx="11" fill="url(#tile-blue)"/>
    <rect x="184" y="100" width="38" height="48" rx="11" fill="url(#tile-green)"/>
    <rect x="112" y="156" width="110" height="58" rx="12" fill="url(#tile-amber)"/>
  </g>
  <circle cx="184" cy="184" r="25" fill="#0b1020" stroke="#eef2fa" stroke-width="7"/>
  <path d="m202 202 19 19" fill="none" stroke="#eef2fa" stroke-width="9" stroke-linecap="round"/>
  <circle cx="184" cy="184" r="8" fill="#6e8bff"/>
