[advisories]
# GTK's current Windows/Linux dependency tree still pulls this unmaintained
# diagnostic helper; there is no compatible safe replacement in that chain.
ignore = [{ id = "RUSTSEC-2024-0370", reason = "Transitive GTK dependency; no safe compatible upgrade is available." }]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
